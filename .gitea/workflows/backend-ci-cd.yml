name: Build, Test and Push Backend

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  # 拉取用镜像加速（只读代理，不支持推送）
  # ⚠️ 另一台镜像 04eh77udwizz5vqdbk.xuanyuan.run 自 2026-09-22 起对
  #    library/* 一律返回 401（连裸名拉取也失败），故改用下面这台。
  MIRROR: 8vl5aon5dsr0lafr0i.xuanyuan.run

  # 推送目标：Gitea 内置容器仓库
  # 用回环地址而非公网 IP —— Docker 默认把 127.0.0.0/8 当不安全仓库放行（允许明文 HTTP），
  # 因此无需修改宿主的 /etc/docker/daemon.json，也不必为它关闭 TLS 校验。
  # CI 与宿主都通过宿主 daemon 发起 push/pull，两边用同一地址即可。
  REGISTRY: 127.0.0.1:3000
  IMAGE: 127.0.0.1:3000/leoxiao/backend
  MIGRATIONS_IMAGE: 127.0.0.1:3000/leoxiao/backend-migrations

jobs:
  # 本 workflow 只负责「构建并推送镜像」，不碰生产环境。
  # 部署由宿主侧的 cron（/home/ubuntu/myblog-deploy/deploy.sh）拉取镜像完成。
  # 因此这里不再需要 DB / JWT / MinIO 等任何生产凭据。
  build-test-push:
    runs-on: self-hosted

    services:
      postgres:
        image: ${{ env.MIRROR }}/library/postgres:18
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: myblog_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: ${{ env.MIRROR }}/library/redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      # 不用 actions/checkout：它要求 runner 去 github.com 拉取该 action，
      # 而本机访问 GitHub 时快时慢（实测 0.5s ~ 11.6s），一旦超过 act 的 10 秒
      # 超时就整个 job 失败。仓库就在同机的 Gitea 上，直接从这里 clone 更稳。
      #
      # 顺带移除了原先指向 ghproxy.com 的 git 镜像重写配置 —— 该域名已不可达，
      # 留着只会让任何指向 github.com 的 git 操作变慢或失败。
      - name: Checkout code
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # 注意：不能用 127.0.0.1 —— 本 job 跑在 runner 容器内，回环地址是
          # 容器自己的，不是宿主的。runner 与 Gitea 同处 gitea-network，
          # 用容器名直连。（镜像操作能用 127.0.0.1 是因为那由宿主 daemon 发起。）
          URL="http://oauth2:${GIT_TOKEN}@gitea-server-1.27:3000/leoxiao/backend.git"
          cd "$GITHUB_WORKSPACE"
          if [ ! -d .git ]; then
            git init --quiet .
            git remote add origin "$URL"
          else
            git remote set-url origin "$URL"
          fi
          # 服务端已开启 uploadpack.allowAnySHA1InWant，可直接按 SHA 浅取
          git fetch --quiet --depth 1 origin "${{ github.sha }}"
          git checkout --quiet FETCH_HEAD
          echo "已检出 ${{ github.sha }}"
          ls -la | head -15

      - name: Setup JDK 21
        run: |
          # Configure Alpine mirrors for faster download
          sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories

          # Install OpenJDK 21
          apk add --no-cache openjdk21
          java -version

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.parallel=true"
          ./gradlew build -x test --no-daemon --build-cache

      - name: Run tests
        env:
          # 用服务名而非 localhost：job 跑在 runner 容器里，localhost 是容器
          # 自己的回环；上面 services 里的 postgres/redis 与 runner 同处
          # gitea-network，按服务名解析。用 localhost + 映射端口会连到容器自身
          # 而报 ConnectException。
          SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/myblog_test
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
          SPRING_DATA_REDIS_HOST: redis
          SPRING_DATA_REDIS_PORT: 6379
          # application.yml 中 minio.secret-key 的默认值是空串，而 MinIO 的
          # Credentials 要求 secret 至少 8 位、access key 至少 3 位，否则构造时直接抛
          # IllegalArgumentException → MinioConfig 建 Bean 失败 → Spring 上下文起不来
          # → 所有 @SpringBootTest 全部连带失败。这里给测试用的占位值；
          # MinioClient.builder() 只构造不连接，因此不需要真实的 MinIO 服务。
          MINIO_ACCESS_KEY: testaccesskey
          MINIO_SECRET_KEY: testsecretkey123
        # 不再用 `|| echo` 吞掉失败：测试是质量门禁，失败就应该拦住流水线，
        # 而不是让坏代码照样构建、推送、上线。
        run: ./gradlew test

      # ============================================
      # 构建并推送镜像（仅 master/main）
      # ============================================
      - name: Check registry credentials
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          MISSING=""
          [ -z "${{ secrets.REGISTRY_USER }}" ] && MISSING="$MISSING REGISTRY_USER"
          [ -z "${{ secrets.REGISTRY_TOKEN }}" ] && MISSING="$MISSING REGISTRY_TOKEN"
          if [ -n "$MISSING" ]; then
            echo "❌ 缺少 Actions secret:$MISSING"
            echo "   请在 Gitea 仓库 Settings → Actions → Secrets 中配置后再推送。"
            exit 1
          fi
          echo "✅ 镜像仓库凭据已配置"

      - name: Login to Gitea container registry
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | \
            docker login ${{ env.REGISTRY }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Pull base image
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: docker pull ${{ env.MIRROR }}/library/eclipse-temurin:21-jre-alpine || true

      - name: Build and push backend image
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "Building ${{ env.IMAGE }}:$SHA"
          # BASE_IMAGE 必须指向可拉取的源，不要指向 Gitea（它不是 Docker Hub 代理）
          docker build \
            -t ${{ env.IMAGE }}:$SHA \
            -t ${{ env.IMAGE }}:latest \
            --build-arg BASE_IMAGE=${{ env.MIRROR }}/library/eclipse-temurin:21-jre-alpine \
            -f Dockerfile.backend .
          docker push ${{ env.IMAGE }}:$SHA
          docker push ${{ env.IMAGE }}:latest
          echo "✅ 已推送 ${{ env.IMAGE }}:$SHA 与 :latest"

      - name: Build and push migrations image
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "Building ${{ env.MIGRATIONS_IMAGE }}:$SHA"
          # 迁移 SQL 打进镜像，宿主侧无需同步文件，凭据只从宿主 .env 读
          docker build \
            -t ${{ env.MIGRATIONS_IMAGE }}:$SHA \
            -t ${{ env.MIGRATIONS_IMAGE }}:latest \
            --build-arg BASE_IMAGE=${{ env.MIRROR }}/flyway/flyway:10-alpine \
            -f Dockerfile.migrations .
          docker push ${{ env.MIGRATIONS_IMAGE }}:$SHA
          docker push ${{ env.MIGRATIONS_IMAGE }}:latest
          echo "✅ 已推送 ${{ env.MIGRATIONS_IMAGE }}:$SHA 与 :latest"

      - name: Build summary
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "镜像已推送，等待宿主侧 cron 拉取部署："
          echo "  ${{ env.IMAGE }}:latest  (=$SHA)"
          echo "  ${{ env.MIGRATIONS_IMAGE }}:latest  (=$SHA)"
