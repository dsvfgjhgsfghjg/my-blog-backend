name: Local Development Deploy

on:
  push:
    branches: [ dev ]

jobs:
  build-and-deploy-local:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Build Docker image
        run: |
          docker build -t myblog-backend:dev \
            --build-arg JAR_FILE=$(ls build/libs/*.jar | head -n 1) \
            -f Dockerfile.backend .

      - name: Run database migrations (dev)
        run: |
          echo "Running Flyway database migrations for dev..."
          docker run --rm \
            --network myblog_myblog-network \
            -v $(pwd)/src/main/resources/db/migration:/flyway/sql:ro \
            flyway/flyway:10-alpine \
            -url=jdbc:postgresql://myblog-postgres:5432/${{ secrets.DB_NAME }} \
            -user=${{ secrets.DB_USER }} \
            -password=${{ secrets.DB_PASSWORD }} \
            -locations=filesystem:/flyway/sql \
            migrate || echo "⚠️ Migration may have failed, check logs"

      - name: Stop old container
        run: |
          docker stop myblog-backend-dev || true
          docker rm myblog-backend-dev || true

      - name: Verify migration status (dev)
        run: |
          echo "Migration status:"
          docker run --rm \
            --network myblog_myblog-network \
            flyway/flyway:10-alpine \
            -url=jdbc:postgresql://myblog-postgres:5432/${{ secrets.DB_NAME }} \
            -user=${{ secrets.DB_USER }} \
            -password=${{ secrets.DB_PASSWORD }} \
            info || echo "⚠️ Cannot verify migration status"

      - name: Start new container
        run: |
          docker run -d \
            --name myblog-backend-dev \
            --network myblog_myblog-network \
            -p 8081:8080 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://myblog-postgres:5432/${{ secrets.DB_NAME }} \
            -e SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USER }} \
            -e SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -e SPRING_DATA_REDIS_HOST=myblog-redis \
            -e SPRING_DATA_REDIS_PORT=6379 \
            -e MINIO_ENDPOINT=http://myblog-minio:9000 \
            -e MINIO_ACCESS_KEY=${{ secrets.MINIO_ROOT_USER }} \
            -e MINIO_SECRET_KEY=${{ secrets.MINIO_ROOT_PASSWORD }} \
            -e MINIO_BUCKET_NAME=${{ secrets.MINIO_BUCKET_NAME }} \
            -e SPRING_PROFILES_ACTIVE=dev \
            --restart unless-stopped \
            myblog-backend:dev
          
          echo "Local deployment completed!"
          echo "Access at: http://localhost:8081"
