name: myblog-local

services:
  postgres:
    image: ${MIRROR:-docker.io}/library/postgres:18
    container_name: myblog-postgres-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myblog
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../sql/myblog_schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d myblog"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: ${MIRROR:-docker.io}/library/redis:7-alpine
    container_name: myblog-redis-local
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data

  minio:
    image: ${MIRROR:-docker.io}/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: myblog-minio-local
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres-data:
  redis-data:
  minio-data:
