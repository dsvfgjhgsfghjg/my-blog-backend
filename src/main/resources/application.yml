server:
  port: 8080

spring:
  application:
    name: myblog
  
  # =====================
  # 文件上传配置
  # 安全修复V11: 限制请求体大小，防止DoS攻击
  # =====================
  servlet:
    multipart:
      max-file-size: 10MB       # 单个文件最大大小（文章图片上传需要10MB）
      max-request-size: 15MB    # 整个请求最大大小（10MB文件 + multipart开销）
      enabled: true             # 启用文件上传
  
  # =====================
  # PostgreSQL 数据库配置
  # 安全修复V12: 优化HikariCP连接池配置
  # =====================
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:myblog}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}  # 通过环境变量注入
    hikari:
      maximum-pool-size: 20        # 最大连接数
      minimum-idle: 5              # 最小空闲连接数
      connection-timeout: 30000    # 连接超时时间（30秒）
      idle-timeout: 600000         # 空闲连接超时时间（10分钟）
      max-lifetime: 1800000        # 连接最大生命周期（30分钟）
      keepalive-time: 30000        # 保持活跃时间（30秒）
      validation-timeout: 5000     # 连接验证超时时间（5秒）
      leak-detection-threshold: 60000  # 连接泄露检测阈值（60秒）
  
  # =====================
  # H2 数据库配置（开发测试用，取消注释即可使用）
  # =====================
  # datasource:
  #   driver-class-name: org.h2.Driver
  #   url: jdbc:h2:mem:myblog  # 内存模式，重启后数据丢失
  #   username: sa
  #   password:
  # h2:
  #   console:
  #     enabled: true  # 启用H2控制台，访问 http://localhost:8080/h2-console
  
  # =====================
  # Redis 配置
  # =====================
  data:
    redis:
      host: localhost
      port: 6379
      password:  # 如果Redis有密码，在此填写
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8      # 连接池最大连接数
          max-idle: 8        # 连接池最大空闲连接数
          min-idle: 0        # 连接池最小空闲连接数
          max-wait: -1ms     # 连接池最大阻塞等待时间（负值表示没有限制）

  # =====================
  # Flyway 数据库迁移配置
  # =====================
  # 注意：CI/CD 流水线中使用独立 Flyway 容器管理迁移，
  # 应用容器不执行 Flyway 迁移，避免重复版本号冲突
  flyway:
    enabled: false

# =====================
# MyBatis-Plus 配置
# =====================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true  # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印SQL日志（开发环境）
  global-config:
    db-config:
      id-type: ASSIGN_ID  # 使用雪花算法生成ID
      logic-delete-field: isDeleted  # 逻辑删除字段
      logic-delete-value: true  # PostgreSQL使用BOOLEAN类型
      logic-not-delete-value: false
  mapper-locations: classpath*:/mapper/**/*.xml

# =====================
# MinIO 配置
# =====================
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}  # MinIO服务地址
  access-key: ${MINIO_ACCESS_KEY:minioadmin}          # 访问密钥
  secret-key: ${MINIO_SECRET_KEY:}                    # 秘密密钥（通过环境变量注入）
  bucket-name: ${MINIO_BUCKET_NAME:myblog}            # 存储桶名称（头像等）
  captcha-bucket-name: captcha-backgrounds            # 验证码背景图存储桶

# =====================
# OAuth 2.0 配置
# =====================
oauth2:
  access-token:
    expires-in: 3600              # Access Token 过期时间（秒），默认1小时
  refresh-token:
    expires-in: 2592000            # Refresh Token 过期时间（秒），默认30天
  authorization-code:
    expires-in: 300                # 授权码过期时间（秒），默认5分钟

# =====================
# 第三方 OAuth 登录配置
# =====================
third-party:
  oauth:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:3000/auth/oauth/github/callback}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/oauth/google/callback}

# =====================
# JWT 配置
# =====================
jwt:
  # ⚠️ 这里的默认值是**公开的**，仅供本地开发与测试。
  # 生产必须通过 JWT_SECRET 环境变量注入 —— JwtUtil 会在 prod profile 下强制校验
  # 环境变量确实存在，否则拒绝启动：用公开默认值启动意味着任何人都能伪造 admin token。
  secret: ${JWT_SECRET:your_jwt_secret_key_here_change_it_to_a_long_random_string}
  expiration: 86400000  # token过期时间（毫秒），默认24小时
  header: Authorization  # HTTP头名称
  prefix: Bearer         # token前缀
  cookie:
    name: AUTH_TOKEN     # Cookie名称
    max-age: 86400       # Cookie过期时间（秒），默认24小时
    secure: false        # 仅HTTPS传输（生产环境必须设为true）
    expose-token-in-body: true  # 登录响应体中是否返回Token（Cookie模式下建议设为false）

# =====================
# 日志配置
# =====================
logging:
  level:
    com.leo.myblog: DEBUG
    org.springframework.security: DEBUG

# =====================
# Actuator 配置（健康检查）
# =====================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
